{{- if .Values.installInfrastructure.metallb }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: node-pool
  namespace: metallb-system
spec:
  addresses:
  - {{ .Values.metallb.ipRange }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - node-pool
{{- end }}