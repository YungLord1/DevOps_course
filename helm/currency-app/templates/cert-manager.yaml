apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.host | replace "." "-" }}-cert
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.ingress.tlsSecretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.certManager.clusterIssuer }}
  commonName: {{ .Values.ingress.host }}
  dnsNames:
  - {{ .Values.ingress.host }}
  - www.{{ .Values.ingress.host }}