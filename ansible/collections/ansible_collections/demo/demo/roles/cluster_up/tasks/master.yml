---
- name: Kubeadm init
  ansible.builtin.command: kubeadm init --apiserver-advertise-address=10.184.0.43 --pod-network-cidr=192.168.0.0/16 --service-cidr=10.96.0.0/12
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory
  ansible.builtin.file:
    path: /home/master/.kube
    state: directory
    mode: '0755'

- name: Copy admin.conf to User's kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/master/.kube/config
    remote_src: yes
    owner: master

- name: Generate join command for workers
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw

- name: Set join command as a global
  ansible.builtin.set_fact:
    global_join_command: "{{ join_command_raw.stdout }}"

- name: Download Calico manifests
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/tmp/{{ item.file }}"
  loop:
    - { url: 'https://raw.githubusercontent.com/projectcalico/calico/v3.25.2/manifests/tigera-operator.yaml', file: 'operator.yaml' }
    - { url: 'https://raw.githubusercontent.com/projectcalico/calico/v3.25.2/manifests/custom-resources.yaml', file: 'resources.yaml' }

- name: Apply Calico manifests simply
  ansible.builtin.shell: "kubectl create -f /tmp/{{ item }} || true"
  loop:
    - operator.yaml
    - resources.yaml
  environment:
    KUBECONFIG: /home/master/.kube/config
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    no_proxy: "*"
