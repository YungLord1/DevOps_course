apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt
    solvers:
    - http01:
        ingress:
          class: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chach-industry-cert
  namespace: staging
spec:
  secretName: chach-tls-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  commonName: chach-industry.pro
  dnsNames:
  - chach-industry.pro
  - www.chach-industry.pro
