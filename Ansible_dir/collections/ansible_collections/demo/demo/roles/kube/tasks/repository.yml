---
- name: Install GPG key k8s
  ansible.builtin.shell:
    cmd: "curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key -o {{ k8s_keyring_file }}"
    creates: "{{ k8s_keyring_file }}"
  tags:
    - k8s_repo

- name: Add apt repository
  ansible.builtin.apt_repository:
    repo: "{{ k8s_repo_definition }}"
    state: present
    filename: kubernetes
    update_cache: true
  tags:
    - k8s_repo
